<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold's Gym Management System</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #141414;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #ffffff;
        }
        .login-container {
            background-color: #181818;
            padding: 40px;
            border-radius: 16px;
            border: 1px solid rgba(255, 180, 0, 0.2);
            width: 350px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
        }
        h2 {
            color: #FFB400;
            text-transform: uppercase;
            margin-bottom: 25px;
            letter-spacing: 1px;
        }
        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            background-color: #222;
            color: white;
            box-sizing: border-box;
            font-size: 14px;
        }
        input:focus {
            border-color: #FFB400;
            outline: none;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #FFB400;
            color: #141414;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 16px;
            text-transform: uppercase;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #e09e00;
        }
        .dashboard-container {
            display: none;
            width: 90%;
            max-width: 1200px;
            background-color: #181818;
            padding: 30px;
            border-radius: 16px;
            border: 1px solid rgba(255, 180, 0, 0.2);
        }
    </style>
</head>
<body>

    <!-- LOGIN SCREEN -->
    <div class="login-container" id="loginBox">
        <h2>Gold's Gym Login</h2>
        <input type="text" id="mobileNumber" placeholder="Mobile Number">
        <input type="password" id="otpNumber" placeholder="Enter OTP">
        <button onclick="handleLogin()">Login</button>
    </div>

    <!-- MAIN SYSTEM DASHBOARD -->
    <div class="dashboard-container" id="dashboardBox">
        <h2 style="text-align: left; margin-bottom: 10px;">Gold's Gym Scheduling Panel</h2>
        <p style="color: #aaa; margin-bottom: 30px;">Welcome back. Manage gym outreach campaigns and updates.</p>
        <hr style="border: 0; border-top: 1px solid #333; margin-bottom: 20px;">
        <p style="color: #FFB400; font-size: 18px;">✓ System Core Connected Successfully.</p>
    </div>

    <script>
        function handleLogin() {
            var mobile = document.getElementById('mobileNumber').value;
            var otp = document.getElementById('otpNumber').value;

            if (otp === "123456") {
                document.getElementById('loginBox').style.display = 'none';
                document.getElementById('dashboardBox').style.display = 'block';
            } else {
                alert("Wrong OTP! Please use the master bypass code: 123456");
            }
        }
    </script>
</body>
</html>
